<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Achievement</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-cover bg-center min-h-screen flex items-center justify-center p-6" style="background-image:url('https://images.unsplash.com/photo-1454165804606-c3d57bc86b40');">
    <div class="bg-slate-900/80 backdrop-blur-xl p-10 rounded-[2.5rem] shadow-2xl w-full max-w-lg border border-white/20">
        <h2 class="text-3xl font-black text-white mb-8 text-center uppercase tracking-widest">Add Record</h2>
        <form class="space-y-5">
            <input class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-400 p-4 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none font-medium" placeholder="Student Name">
            <input class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-400 p-4 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none font-medium" placeholder="Activity Name (e.g. Chess)">
            <input class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-400 p-4 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none font-medium" placeholder="Level (e.g. District)">
            <input class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-400 p-4 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none font-medium" placeholder="Award (e.g. Gold Medal)">
            <button type="button" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-4 rounded-2xl font-black text-lg shadow-lg transition-all mt-4">
                SAVE ACHIEVEMENT
            </button>
            <a href="admin.html" class="block text-center text-gray-400 font-bold hover:text-white transition-colors mt-6 uppercase tracking-wider text-sm">← Back to Dashboard</a>
        </form>
    </div>
</body>
</html>
