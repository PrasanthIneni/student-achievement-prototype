<!DOCTYPE html>
<html>
<head>
  <title>Add Achievement</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-8">

<h1 class="text-3xl font-bold mb-6">Add New Achievement</h1>

<form class="bg-white p-6 rounded-xl shadow max-w-lg space-y-4">

  <input class="w-full border p-3 rounded" placeholder="Student Name">
  <input class="w-full border p-3 rounded" placeholder="Activity Name">

  <select class="w-full border p-3 rounded">
    <option>Sports</option>
    <option>Cultural</option>
    <option>Technical</option>
  </select>

  <select class="w-full border p-3 rounded">
    <option>College</option>
    <option>State</option>
    <option>National</option>
  </select>

  <input class="w-full border p-3 rounded" placeholder="Award / Participation">

  <button class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold">
    Save Achievement
  </button>

</form>

<a href="admin.html" class="text-blue-600 mt-6 inline-block">
  ← Back to Dashboard
</a>

</body>
</html>
