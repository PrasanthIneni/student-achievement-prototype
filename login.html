<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Student Achievement Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-900 via-purple-900 to-black">

  <div class="bg-white p-8 rounded-2xl shadow-2xl w-[350px] animate-fade-in">
    <h2 class="text-3xl font-bold text-center mb-6">Login</h2>

    <input
      type="text"
      placeholder="Username"
      class="w-full border p-3 rounded mb-4"
    />

    <input
      type="password"
      placeholder="Password"
      class="w-full border p-3 rounded mb-6"
    />

    <!-- STUDENT LOGIN -->
    <a href="student.html">
      <button class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg mb-3 transition">
        Login as Student
      </button>
    </a>

    <!-- ADMIN LOGIN -->
    <a href="admin.html">
      <button class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded-lg transition">
        Login as Admin
      </button>
    </a>

    <p class="text-center text-sm text-gray-500 mt-6">
      Demo login • No authentication
    </p>
  </div>

</body>
</html>
