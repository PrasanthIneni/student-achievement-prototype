<!DOCTYPE html>
<html lang="en">
<head>
    <title>Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-cover bg-center min-h-screen flex items-center justify-center" style="background-image:url('https://images.unsplash.com/photo-1432888498266-38ffec3eaf0a');">
    <div class="bg-white/95 backdrop-blur-md p-10 rounded-[2rem] shadow-2xl w-[400px] border border-gray-100">
        <h2 id="loginTitle" class="text-3xl font-black mb-8 text-center text-gray-800 uppercase tracking-wide">Login</h2>
        <div class="space-y-5">
            <input id="user" class="w-full bg-gray-50 border border-gray-200 p-4 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-gray-700 font-medium" placeholder="Username">
            <input id="pass" type="password" class="w-full bg-gray-50 border border-gray-200 p-4 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-gray-700 font-medium" placeholder="Password">
            <button onclick="login()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-4 rounded-xl font-bold text-lg transition-all shadow-lg active:scale-95">
                Sign In
            </button>
        </div>
        <p id="msg" class="text-red-500 text-center mt-5 text-sm font-bold"></p>
        <a href="login-choice.html" class="block text-center text-gray-500 mt-6 text-sm hover:text-indigo-600 font-medium transition-colors">← Change Role</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const role = params.get("role");
        document.getElementById('loginTitle').innerText = `${role || 'User'} Login`;

        function login(){
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            if(role === "student" && u === "student" && p === "1234") location.href = "student.html";
            else if(role === "admin" && u === "admin" && p === "admin") location.href = "admin.html";
            else document.getElementById('msg').innerText = "Invalid credentials!";
        }
    </script>
</body>
</html>
