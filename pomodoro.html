<!DOCTYPE html>
<html>
<head>
  <title>Pomodoro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-red-100 flex flex-col items-center justify-center min-h-screen">

<h1 class="text-4xl font-bold mb-6">⏱️ Pomodoro</h1>
<h2 id="timer" class="text-6xl font-bold mb-6">25:00</h2>

<button onclick="start()" class="bg-red-600 text-white px-8 py-3 rounded-xl">Start</button>

<a href="student.html" class="mt-6 text-red-800">← Back</a>

<script>
let time = 1500;
let interval;

function start() {
  if (interval) return;
  interval = setInterval(() => {
    time--;
    const m = Math.floor(time / 60);
    const s = time % 60;
    document.getElementById("timer").innerText =
      `${m}:${s.toString().padStart(2, "0")}`;
    if (time <= 0) clearInterval(interval);
  }, 1000);
}
</script>
</body>
</html>
