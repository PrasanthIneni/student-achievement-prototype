services:
  - type: web
    name: studentachievementcentre-backend
    env: java
    branch: main
    repo: https://github.com/PrasanthIneni/student-achievement-prototype
    buildCommand: cd backend && mvn clean package
    startCommand: java -jar backend/target/student-activity-0.0.1-SNAPSHOT.jar
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studentachievementcentre-db
          property: connectionString

databases:
  - name: studentachievementcentre-db
    engine: mysql
    plan: starter
    databaseName: studentdb
