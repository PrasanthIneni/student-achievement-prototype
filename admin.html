<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white flex min-h-screen">
    <div class="w-full max-w-4xl mx-auto p-10">
        <header class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-4xl font-bold">Admin Dashboard</h1>
                <p class="text-gray-400 mt-2">Manage student records and global achievements</p>
            </div>
            <a href="index.html" class="bg-red-500/10 text-red-500 px-6 py-2 rounded-lg font-bold border border-red-500/20">Logout</a>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                <h3 class="text-gray-500 text-sm">Total Students</h3>
                <p class="text-3xl font-bold">1,284</p>
            </div>
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                <h3 class="text-gray-500 text-sm">Active Sessions</h3>
                <p class="text-3xl font-bold">42</p>
            </div>
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                <h3 class="text-gray-500 text-sm">System Status</h3>
                <p class="text-3xl font-bold text-green-500">Online</p>
            </div>
        </div>

        <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-800 text-gray-400 text-xs uppercase">
                    <tr>
                        <th class="p-4">Student ID</th>
                        <th class="p-4">Name</th>
                        <th class="p-4">Status</th>
                        <th class="p-4">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-800">
                    <tr>
                        <td class="p-4 font-mono text-indigo-400">#STU-992</td>
                        <td class="p-4 font-medium">Alex Johnson</td>
                        <td class="p-4"><span class="bg-green-500/20 text-green-500 px-3 py-1 rounded-full text-xs">Active</span></td>
                        <td class="p-4"><button class="text-gray-500 hover:text-white transition-colors">Edit</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
