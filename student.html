<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body class="flex min-h-screen font-sans bg-fixed bg-cover" style="background-image:url('https://images.unsplash.com/photo-1497032628192-86f99bcd76bc');">

<div class="w-72 min-h-screen p-6 text-white bg-slate-950/90 backdrop-blur-xl flex flex-col fixed shadow-2xl border-r border-white/10">
    <h2 class="text-2xl font-black mb-10 flex items-center gap-3 text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400">
        <span class="bg-indigo-600 text-white p-2 rounded-lg text-sm">PE</span> ProductiveEdge
    </h2>
    <nav class="space-y-3 flex-1">
        <button onclick="show('ach')" class="w-full text-left p-4 rounded-xl hover:bg-white/10 transition-colors flex items-center gap-3 font-medium">🏆 Achievements</button>
        <button onclick="show('goals')" class="w-full text-left p-4 rounded-xl hover:bg-white/10 transition-colors flex items-center gap-3 font-medium">🎯 Goals</button>
        <button onclick="show('tasks')" class="w-full text-left p-4 rounded-xl hover:bg-white/10 transition-colors flex items-center gap-3 font-medium">✅ Tasks</button>
        <button onclick="show('pomo')" class="w-full text-left p-4 rounded-xl hover:bg-white/10 transition-colors flex items-center gap-3 font-medium">⏱️ Pomodoro</button>
        <button onclick="show('prog')" class="w-full text-left p-4 rounded-xl hover:bg-white/10 transition-colors flex items-center gap-3 font-medium">📊 Analytics</button>
    </nav>
    <a href="index.html" class="p-4 text-red-400 hover:bg-red-500/20 rounded-xl transition-colors font-bold text-center border border-red-500/20 mt-auto">🚪 Logout</a>
</div>

<div class="flex-1 ml-72 p-12 bg-black/40 backdrop-blur-sm min-h-screen">
    
    <div id="ach" class="content-sec animate__animated animate__fadeIn">
        <h1 class="text-4xl font-black text-white mb-8 drop-shadow-lg">Achievements</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white/95 backdrop-blur-md p-8 rounded-[2rem] shadow-xl border border-white/20 hover:scale-[1.02] transition-transform">
                <span class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-xs font-black tracking-widest mb-4 inline-block">SPORTS</span>
                <h3 class="text-2xl font-black text-slate-800">Basketball Winner</h3>
                <p class="text-gray-500 mt-2 font-medium">Dec 2025 • Inter-college Championship Trophy</p>
            </div>
        </div>
    </div>

    <div id="goals" class="content-sec hidden animate__animated animate__fadeIn">
        <h1 class="text-4xl font-black text-white mb-8 drop-shadow-lg">Academic Goals</h1>
        <div class="bg-white/95 backdrop-blur-md p-8 rounded-[2rem] shadow-xl">
            <div class="flex gap-4 mb-8">
                <input id="goalInput" class="flex-1 bg-gray-50 border border-gray-200 p-4 rounded-2xl outline-none focus:ring-2 ring-indigo-500 text-gray-800 font-medium" placeholder="Set a new milestone...">
                <button onclick="addItem('goal')" class="bg-indigo-600 text-white px-10 rounded-2xl font-bold shadow-lg hover:bg-indigo-500 transition-colors">Add</button>
            </div>
            <ul id="goalList" class="space-y-4"></ul>
        </div>
    </div>

    <div id="tasks" class="content-sec hidden animate__animated animate__fadeIn">
        <h1 class="text-4xl font-black text-white mb-8 drop-shadow-lg">Daily Tasks</h1>
        <div class="bg-white/95 backdrop-blur-md p-8 rounded-[2rem] shadow-xl">
            <div class="flex gap-4 mb-8">
                <input id="taskInput" class="flex-1 bg-gray-50 border border-gray-200 p-4 rounded-2xl outline-none focus:ring-2 ring-emerald-500 text-gray-800 font-medium" placeholder="What needs to be done today?">
                <button onclick="addItem('task')" class="bg-emerald-500 text-white px-10 rounded-2xl font-bold shadow-lg hover:bg-emerald-400 transition-colors">Add</button>
            </div>
            <ul id="taskList" class="space-y-4"></ul>
        </div>
    </div>

    <div id="pomo" class="content-sec hidden animate__animated animate__zoomIn">
        <div class="max-w-lg mx-auto bg-white/95 backdrop-blur-md p-12 rounded-[3rem] shadow-2xl text-center border border-white/50 mt-10">
            <div id="tomatoIcon" class="text-8xl mb-6 transition-all duration-500 drop-shadow-xl">🍅</div>
            <h1 class="text-3xl font-black text-slate-800 mb-2">Deep Focus Timer</h1>
            <p class="text-gray-500 font-medium mb-8">Stay productive. Eliminate distractions.</p>
            <div id="timerDisplay" class="text-8xl font-black text-indigo-600 mb-10 font-mono tracking-tighter drop-shadow-sm">25:00</div>
            <div class="flex gap-4 justify-center">
                <button onclick="startPomo()" class="bg-indigo-600 text-white px-12 py-5 rounded-2xl font-black text-lg shadow-xl hover:bg-indigo-500 active:scale-95 transition-all">START</button>
                <button onclick="resetPomo()" class="bg-slate-200 text-slate-700 px-12 py-5 rounded-2xl font-black text-lg hover:bg-slate-300 transition-colors">RESET</button>
            </div>
        </div>
    </div>

    <div id="prog" class="content-sec hidden animate__animated animate__fadeIn">
        <h1 class="text-4xl font-black text-white mb-8 drop-shadow-lg">Performance Analytics</h1>
        <div class="bg-white/95 backdrop-blur-md p-8 rounded-[2rem] shadow-xl">
            <canvas id="myChart" height="100"></canvas>
        </div>
    </div>
</div>

<script>
    function show(id){
        document.querySelectorAll('.content-sec').forEach(el => el.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function addItem(type) {
        const input = document.getElementById(`${type}Input`);
        const list = document.getElementById(`${type}List`);
        if (!input.value) return;
        const li = document.createElement('li');
        li.className = "bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center animate__animated animate__slideInLeft";
        li.innerHTML = `<span class="font-bold text-gray-700">${input.value}</span><button onclick="this.parentElement.remove()" class="text-red-500 bg-red-50 hover:bg-red-100 p-2 rounded-lg transition-colors">✕</button>`;
        list.appendChild(li);
        input.value = "";
    }

    let timeLeft = 1500;
    let timerId = null;

    function startPomo() {
        if (timerId) return;
        document.getElementById('tomatoIcon').classList.add('animate__animated', 'animate__bounce', 'animate__infinite');
        timerId = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) {
                clearInterval(timerId);
                document.getElementById('tomatoIcon').classList.remove('animate__animated', 'animate__bounce', 'animate__infinite');
                alert("Session complete! Time for a break.");
            }
        }, 1000);
    }

    function resetPomo() {
        clearInterval(timerId);
        timerId = null;
        timeLeft = 1500;
        document.getElementById('tomatoIcon').classList.remove('animate__animated', 'animate__bounce', 'animate__infinite');
        updateTimerDisplay();
    }

    function updateTimerDisplay() {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        document.getElementById('timerDisplay').innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    new Chart(document.getElementById('myChart'), {
        type: 'bar',
        data: {
            labels: ['Tasks Completed', 'Goals Met', 'Pomodoro Sessions', 'Projects Finished'],
            datasets: [{
                label: 'Weekly Metrics',
                data: [15, 6, 12, 4],
                backgroundColor: ['#4f46e5', '#10b981', '#f43f5e', '#f59e0b'],
                borderRadius: 8
            }]
        },
        options: {
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true } }
        }
    });
</script>
</body>
</html>
